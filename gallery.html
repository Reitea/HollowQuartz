<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- OGP -->

    <style>
        /* ギャラリー専用スタイル */
        .simple-gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 検索・フィルター */
        .gallery-controls {
            margin: 20px 0;
            text-align: center;
        }
        
        /* 検索ボックス */
        .search-box {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 250px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        }

        /* キャラクター選択コントロール */
        .character-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin: 10px 0;
        }

        .character-filter label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        /* ソートコントロールのラッパー */
        .sort-control {
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }

        .sort-control label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        /* セレクトボックス本体 */
        #sortSelect, #pageSizeSelect, #characterSelect {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #sortSelect:hover, #pageSizeSelect:hover, #characterSelect:hover {
            border-color: #3498db;
        }
        .pagination-info {
            margin: 10px 0;
            color: #666;
        }
        
        /* ページネーション */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            gap: 10px;
        }
        
        .pagination button {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #f0f0f0;
        }
        
        .pagination button:disabled {
            color: #ccc;
            cursor: not-allowed;
        }
        
        .pagination button.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .pagination select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }
        
        /* ギャラリーグリッド */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .gallery-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: white;
            position: relative;
        }
        
        img:hover {
        transform: scale(1.0);
        }
        .gallery-item:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 10;
        }
        
        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            object-position: top;
            display: block;
            background: #f5f5f5;
            transition: opacity 0.3s ease;
            opacity: 0; /* 初期状態は透明 */
        }
        
        .gallery-item img.loaded {
            opacity: 1; /* 読み込み完了時に不透明 */
        }
        
        /* 画像読み込み中のプレースホルダー */
        .gallery-item .image-placeholder {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            color: #999;
            font-size: 14px;
        }
        
        .gallery-item img.loading {
            opacity: 0.5;
        }
        
        .gallery-item img.loaded {
            opacity: 1;
        }
        
        .gallery-item .image-name {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: #333;
            word-break: break-all;
            font-size: 12px;
            line-height: 1.3;
            max-height: 40px;
            overflow: hidden;
        }
        
        /* サイズ情報 */
        .gallery-item .image-info {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .gallery-item:hover .image-info {
            opacity: 1;
        }
        
        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0);
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .modal.opening {
            display: flex;
            background-color: rgba(0,0,0,0.95);
        }

        .modal.closing {
            background-color: rgba(0,0,0,0);
        }
        
        .modal-content {
            position: relative;
            width: 90vw;
            height: 90vh;
            max-width: 1200px;
            max-height: 800px;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.3);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .modal.opening .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal.closing .modal-content {
            transform: scale(0.3);
            opacity: 0;
        }
        
        /* モーダルヘッダー */
        .modal-header {
            background: #2d2d2d;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }
        
        .modal-title {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
            flex: 1;
            text-align: left;
            word-break: break-all;
        }
        
        .modal-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .zoom-controls {
            display: flex;
            gap: 5px;
            align-items: center;

        }
        
        .zoom-btn, .nav-btn, .close {
            background: #444;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            font-size: 16px;
        }
        
        .zoom-btn:hover, .nav-btn:hover, .close:hover {
            background: #555;
        }
        
        .zoom-btn:disabled, .nav-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        
        .zoom-info {
            color: #ccc;
            font-size: 14px;
            min-width: 50px;
            text-align: center;
            vertical-align: middle;
        }
        
/* モーダル内の画像コンテナ */
.modal-image-container {
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    background: #000;
    transition: background-color 0.3s ease;
}

.modal-image-container.bg-white {
    background: #fff;
}

/* 背景切り替えボタン */
.bg-toggle-btn {
    background: #444;
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.2s;
    font-size: 14px;
}

.bg-toggle-btn:hover {
    background: #555;
}

.bg-toggle-btn.active {
    background: #e0e0e0;
    color: #333;
    border: 1px solid #999;
}

/* ヘッダーランダム画像 */
.header-random-image {
    position: absolute;
    right: 8%;
    top: 50%;
    transform: translateY(-50%);
    width: 350px;
    height: 250px;
    object-fit: cover;
    object-position: top center;
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
}

.header-random-image.loaded {
    opacity: 0.88;
}

/* タブレット */
@media (max-width: 768px) {
    .header-random-image {
        width: 180px;
        height: 160px;
        right: 3%;
    }
}

/* スマホ */
@media (max-width: 480px) {
    .header-random-image {
        display: none;
    }
}

/* PC用の設定 */
@media (min-width: 769px) {
    .modal-image-container {
        touch-action: none; /* PCではカスタムズームを使用 */
    }
}

/* スマホ用の設定 */
@media (max-width: 768px) {
    .modal-image-container {
        touch-action: pan-x pan-y pinch-zoom; /* パン操作も許可 */
        overflow: auto; /* スクロールも許可 */
    }
    
    /* スマホでは画像に直接ズーム機能を適用 */
    .modal img {
        touch-action: pan-x pan-y pinch-zoom;
        user-select: none;
        -webkit-user-select: none;
        max-width: none !important;
        max-height: none !important;
        width: auto;
        height: auto;
    }
    
    /* ラッパーも調整 */
    #modalImageWrapper {
        touch-action: pan-x pan-y pinch-zoom;
    }
}

#modalImageWrapper {
    transition: transform 0.1s ease-out; /* ズームを滑らかに */
    will-change: transform;
    cursor: grab;
}

#modalImageWrapper.dragging {
    cursor: grabbing;
    transition: none; /* ドラッグ中は追従性を優先してアニメーションをオフに */
}

        
        .modal-image-wrapper {
            position: relative;
            transform-origin: center center;
            transition: transform 0.3s ease;
            cursor: grab;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .modal-image-wrapper.dragging {
            cursor: grabbing;
            transition: none;
        }
        
        .modal img {
            object-fit: contain;
            display: block;
            width: auto;
            height: auto;
            transform-origin: center center;
        }

        /* 画像の自動フィット用クラス */
        .modal img.fit-width {
            width: 100%;
            height: auto;
            max-height: none;
        }

        .modal img.fit-height {
            width: auto;
            height: 100%;
            max-width: none;
        }
        
        /* ナビゲーションボタン */
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: background-color 0.2s, opacity 0.2s;
            opacity: 0.7;
        }
        
        .modal-nav:hover {
            background: rgba(0,0,0,0.9);
            opacity: 1;
        }
        
        .modal-nav:disabled {
            background: rgba(0,0,0,0.3);
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .modal-nav.prev {
            left: 20px;
        }
        
        .modal-nav.next {
            right: 20px;
        }
        
        /* モーダルフッター */
        .modal-footer {
            background: #2d2d2d;
            padding: 6px 16px;
            border-top: 1px solid #444;
            color: #ccc;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 0;
        }
        
        .modal-info {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            gap: 0;
            overflow: hidden;
        }

        .modal-info span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-info span + span::before {
            content: ' | ';
            color: #666;
        }
        
        .modal-counter {
            color: white;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
        }
        
        /* ローディングメッセージ */
        .loading-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 16px;
        }
        
        /* エラーカード */
        .gallery-item.error-item {
            background: #fff5f5;
            border-color: #fed7d7;
        }
        
        .error-placeholder {
            width: 100%;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fed7d7;
            color: #c53030;
        }
        
        .error-placeholder i {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .error-placeholder p {
            margin: 0;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .modal-content {
                width: 95vw;
                height: 80vh;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .gallery-item img {
                height: 120px;
            }
            
            .gallery-item .image-placeholder {
                height: 120px;
            }
            
            .search-box {
                width: 250px;
            }
            
            .pagination {
                flex-wrap: wrap;
            }
        }
        
        /* パフォーマンス最適化 */
        .gallery-item {
            will-change: transform;
        }
        
        /* スケルトンローディング効果 */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
/* スマホ用の大きな操作ボタン（オプション） */
@media (max-width: 768px) {
    .modal-controls {
        bottom: 20px;
        gap: 20px;
    }
    /* スマホではズームボタンを非表示（標準ピンチズームを使用） */
    .zoom-controls {
        display: none;
    }
    
    /* ズームボタンを大きくして押しやすくする（PC用のフォールバック） */
    .zoom-btn {
        padding: 12px;
        font-size: 18px;
    }
    .modal{
        padding: 70px 25px;
    }
    .modal img {
        /* 画質劣化の主犯候補をすべてリセット */
        image-rendering: auto !important;
        -webkit-backface-visibility: visible !important;
        backface-visibility: visible !important;
        
        /* transformの基点をリセット */
        transform-origin: center center;
        
        /* 拡大時に低解像度テクスチャに固定されるのを防ぐ */
        will-change: transform;
    }

    /* コンテナ側の制限も緩める */
    .modal-image-container {
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* はみ出しはJSのズームで管理 */
    }
}
    </style>
</head>

    <header style="cursor: pointer;" id="header-text">
        <img src="HollowQuarts.png" style="position: relative;z-index: -10;" width="60" height="60">

        <span>璃</span>
        <span>の</span>
        <span>虚</span>

        <div class="container">
            <input type="checkbox" name="navToggle" id="navToggle" class="nav-toggle">
            <label for="navToggle" class="btn-burger">
                <div class="icon"></div>
            </label>
            <nav class="nav">
                <ul class="nav-list">

    </header>

    <ul class="topic-path">
        <li><a href="index.html">Introduction</a></li>
        <li><a href="#">Gallery</a></li>
    </ul>
    <!-- メインタイトル -->
    <div class="header" id="gallery-header">
        <p>イラストギャラリー</p>
        <img id="headerRandomImage" class="header-random-image" src="" alt="">
    </div>

    <!-- ギャラリーメインコンテンツ -->
    <div class="body-contain">
        <div class="simple-gallery">
            
            <!-- コントロール -->
            <div class="gallery-controls">
                <input type="text" id="searchInput" class="search-box" placeholder="画像名で検索...">
                <div class="character-filter">
                    <label for="characterSelect">キャラクター:</label>
                    <select id="characterSelect">
                        <option value="">全キャラクター</option>
                    </select>
                </div>
                <div class="sort-control">
                    <label for="sortSelect">並び替え:</label>
                    <select id="sortSelect">
                        <option value="nameAsc">名前順 (A-Z)</option>
                        <option value="nameDesc">名前順 (Z-A)</option>
                        <option value="dateDesc" selected>更新日が新しい順</option>
                        <option value="dateAsc">更新日が古い順</option>
                        <option value="sizeDesc">サイズが大きい順</option>
                    </select>
                </div>
                <div class="pagination-info">
                    <span id="imageCount">画像を読み込み中...</span>
                </div>
            </div>
            
            <!-- ページネーション -->
            <div id="pagination" class="pagination" style="display: none;">
                <button id="firstBtn" disabled>最初へ</button>
                <button id="prevBtn" disabled>前へ</button>
                <span id="pageNumbers"></span>
                <button id="nextBtn" disabled>次へ</button>
                <button id="lastBtn" disabled>最後へ</button>
                <select id="pageSizeSelect">
                    <option value="12">12件/ページ</option>
                    <option value="24" selected>24件/ページ</option>
                    <option value="48">48件/ページ</option>
                    <option value="96">96件/ページ</option>
                </select>
            </div>
            
            <div id="loading" class="loading">画像を読み込み中...</div>
            <div id="error" class="error" style="display: none;">画像の読み込みに失敗しました</div>
            <div id="gallery-grid" class="gallery-grid"></div>
            
            <!-- 下部ページネーション -->
            <div id="paginationBottom" class="pagination" style="display: none;">
                <button id="firstBtnBottom" disabled>最初へ</button>
                <button id="prevBtnBottom" disabled>前へ</button>
                <span id="pageNumbersBottom"></span>
                <button id="nextBtnBottom" disabled>次へ</button>
                <button id="lastBtnBottom" disabled>最後へ</button>
            </div>
        </div>
    </div>

    <!-- モーダル -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <!-- ヘッダー -->
            <div class="modal-header">
                <h3 id="modalTitle" class="modal-title">画像タイトル</h3>
                <div class="modal-controls">
                    <div class="zoom-controls">
                        <button id="zoomOutBtn" class="zoom-btn" title="縮小">−</button>
                        <span id="zoomLevel" class="zoom-info">100%</span>
                        <button id="zoomInBtn" class="zoom-btn" title="拡大">+</button>
                    </div>
                        <button id="zoomResetBtn" class="zoom-btn" title="リセット">↻</button>
                        <button id="bgToggleBtn" class="bg-toggle-btn" title="背景を白/黒に切り替え">◑</button>
                    <button class="close" title="閉じる">&times;</button>
                </div>
            </div>
            
            <!-- 画像エリア -->
            <div class="modal-image-container">
                <div id="modalImageWrapper" class="modal-image-wrapper">
                    <img id="modalImage" src="" alt="">
                </div>
                
                <!-- ナビゲーションボタン -->
                <button id="prevImageBtn" class="modal-nav prev" title="前の画像">‹</button>
                <button id="nextImageBtn" class="modal-nav next" title="次の画像">›</button>
            </div>
            
            <!-- フッター -->
            <div class="modal-footer">
                <div class="modal-info">
                    <span id="modalUpdated">最終更新日: --</span>
                    <span id="modalFileSize">ファイルサイズ: --</span>
                    <span id="modalDimensions">サイズ: --</span>
                </div>
                <div id="modalCounter" class="modal-counter">1 / 24</div>
            </div>
        </div>
    </div>

            // 画像のIntersection Observer（遅延読み込み用）
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const placeholder = img.previousElementSibling;
                        
                        img.onload = function() {
                            img.classList.remove('loading');
                            img.classList.add('loaded');
                            if (placeholder) placeholder.style.display = 'none';
                        };
                        
                        img.onerror = function() {
                            img.style.opacity = '0';
                            if (placeholder) {
                                placeholder.textContent = '読み込みエラー';
                                placeholder.style.color = '#e74c3c';
                            }
                        };
                        
                        img.src = img.dataset.src;
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '50px'
            });

            // キャラクター名を画像ファイル名から抽出する関数
            function extractCharacterName(fileName) {
                // 拡張子を除去
                const nameWithoutExt = fileName.replace(/\.[^/.]+$/, "");
                
                // パターン1: "キャラクター名_表情" の形式
                if (nameWithoutExt.includes('_')) {
                    const parts = nameWithoutExt.split('_');
                    
                    // 特殊な場合（数値やバージョンで始まる場合など）の処理
                    if (parts[0].match(/^(落書き|謎状況|天使の分け前|木彫りのフクロウ|ドブ|Dress|ナトレーヌ|レプリカ|ドレス|トルドー)/)) {
                        return parts[0];
                    }
                    
                    // 通常のキャラクター名_表情パターン
                    return parts[0];
                }
                
                // パターン2: アンダースコアがない場合はそのまま
                return nameWithoutExt;
            }

            // キャラクター選択プルダウンを作成する関数（複数画像があるキャラクターのみ）
            function populateCharacterSelect() {
                // 全画像からキャラクター名を抽出し、出現回数をカウント
                const characterCounts = {};
                
                allImages.forEach(image => {
                    const characterName = extractCharacterName(image.displayName);
                    if (characterName && characterName.trim() !== '') {
                        characterCounts[characterName] = (characterCounts[characterName] || 0) + 1;
                    }
                });
                
                // 2つ以上の画像があるキャラクターのみを抽出
                const multipleImageCharacters = Object.keys(characterCounts)
                    .filter(character => characterCounts[character] >= 2)
                    .sort((a, b) => a.localeCompare(b, 'ja'));
                
                // プルダウンをクリア
                characterSelect.innerHTML = '<option value="">全キャラクター</option>';
                
                // キャラクター名をオプションとして追加（複数画像があるもののみ）
                multipleImageCharacters.forEach(character => {
                    const option = document.createElement('option');
                    option.value = character;
                    option.textContent = `${character} (${characterCounts[character]}枚)`;
                    characterSelect.appendChild(option);
                });
                
                console.log(`複数画像があるキャラクター: ${multipleImageCharacters.length}個を検出しました:`, multipleImageCharacters);
                console.log('キャラクター別画像数:', characterCounts);
            }

            // 画像のソート処理
            function sortImages() {
                const sortValue = sortSelect.value;

                filteredImages.sort((a, b) => {
                    switch (sortValue) {
                        case 'nameAsc':
                            return a.displayName.localeCompare(b.displayName, 'ja');
                        case 'nameDesc':
                            return b.displayName.localeCompare(a.displayName, 'ja');
                        case 'dateDesc':
                            return new Date(b.created) - new Date(a.created);
                        case 'dateAsc':
                            return new Date(a.created) - new Date(b.created);
                        case 'sizeDesc':
                            return b.size - a.size;
                        default:
                            return 0;
                    }
                });

                // ソート後は1ページ目に戻って再表示
                currentPage = 1;
                displayCurrentPage();
                setupPagination();
                updateImageCount();
            }
            // 画像リストJSONから画像を読み込み
            async function loadImages() {
                try {
                    loading.style.display = 'block';
                    error.style.display = 'none';
                    galleryGrid.innerHTML = '';
                    isLoading = true;

                    let data;
                    
                    try {
                        const response = await fetch('images-list.json?v=' + Date.now());
                        if (!response.ok) {
                            throw new Error('JSONファイルの読み込みに失敗');
                        }
                        data = await response.json();
                    } catch (fetchError) {
                        console.log('JSONファイルが読み込めません。フォールバック処理を実行します:', fetchError.message);
                        // フォールバック: 固定の画像リストを使用
                        await loadImagesFallback();
                        return;
                    }
                    
                    if (!data.success) {
                        throw new Error(data.error || '画像リストの読み込みに失敗しました');
                    }

                    if (data.images.length === 0) {
                        throw new Error('登録されている画像が見つかりません');
                    }

                    // 画像データを変換
                    allImages = data.images.map(img => ({
                        name: img.filename,
                        path: img.path,
                        displayName: img.name,
                        size: img.size,
                        modified: img.modified,
                        created: img.created,
                        extension: img.extension,
                        sizeText: formatFileSize(img.size)
                    }));

                    // ファイル名でソート
                    //allImages.sort((a, b) => a.displayName.localeCompare(b.displayName, 'ja'));
                    filteredImages = [...allImages];
                    sortImages(); // ここで初期選択されているソート順を適用
                    //filteredImages = [...allImages];
                    currentPage = 1;
                    
                    // キャラクター選択プルダウンを作成
                    populateCharacterSelect();
                    
                    updateImageCount();
                    setupPagination();
                    //displayCurrentPage();
                    
                    loading.style.display = 'none';
                    pagination.style.display = 'flex';
                    paginationBottom.style.display = 'flex';
                    isLoading = false;
                    
                    console.log(`${allImages.length}個の画像を読み込みました`);

                } catch (err) {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                    error.textContent = err.message;
                    console.error('Error loading images:', err);
                    isLoading = false;
                }
            }

            // ファイルサイズをフォーマット
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }

            // 画像数表示を更新
            function updateImageCount() {
                const startIndex = (currentPage - 1) * pageSize + 1;
                const endIndex = Math.min(currentPage * pageSize, filteredImages.length);
                const totalPages = Math.ceil(filteredImages.length / pageSize);
                
                imageCount.textContent = 
                    `${startIndex}-${endIndex} / ${filteredImages.length}件 (${currentPage}/${totalPages}ページ目)`;
            }

            // ページネーション設定
            function setupPagination() {
                const totalPages = Math.ceil(filteredImages.length / pageSize);
                
                // ページ番号生成
                function createPageNumbers(container) {
                    container.innerHTML = '';
                    const maxVisible = 5;
                    const startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2) - Math.max((currentPage + Math.floor(maxVisible / 2)) - totalPages, 0) );
                    const endPage = Math.min(totalPages, startPage + maxVisible - 1);
                    console.log(`Creating page numbers: ${startPage} to ${endPage} (Current: ${currentPage}, Total: ${totalPages})`);
                    
                    for (let i = startPage; i <= endPage; i++) {
                        const btn = document.createElement('button');
                        btn.textContent = i;
                        btn.className = i === currentPage ? 'active' : '';
                        btn.addEventListener('click', () => goToPage(i));
                        container.appendChild(btn);
                    }
                }
                
                createPageNumbers(pageNumbers);
                createPageNumbers(pageNumbersBottom);

                
                // 前へ/次へボタン
                const hasPrev = currentPage > 1;
                const hasNext = currentPage < totalPages;
                
                [firstBtn, firstBtnBottom].forEach(btn => {
                    btn.disabled = !hasPrev;
                });
                [lastBtn, lastBtnBottom].forEach(btn => {
                    btn.disabled = !hasNext;
                });

                [prevBtn, prevBtnBottom].forEach(btn => {
                    btn.disabled = !hasPrev;
                });
                
                [nextBtn, nextBtnBottom].forEach(btn => {
                    btn.disabled = !hasNext;
                });
            }

            // ページ移動
            function goToPage(page) {
                if (isLoading) return;
                
                const totalPages = Math.ceil(filteredImages.length / pageSize);
                if (page < 1 || page > totalPages) return;
                
                currentPage = page;
                displayCurrentPage();
                setupPagination();
                updateImageCount();
                
                // トップにスクロール
                document.querySelector('.simple-gallery').scrollIntoView({ 
                    behavior: 'smooth' 
                });
            }

            // 現在のページを表示
            function displayCurrentPage() {
                const startIndex = (currentPage - 1) * pageSize;
                const endIndex = startIndex + pageSize;
                const pageImages = filteredImages.slice(startIndex, endIndex);
                
                galleryGrid.innerHTML = '';
                
                // 1. まず、このページに表示すべき画像の「枠」を先にすべて作成・配置する
                pageImages.forEach((image) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    
                    // 中身の構造を先に作っておく（画像はまだ表示しない）
                    item.innerHTML = `
                        <div class="image-placeholder">読み込み中...</div>
                        <img src="" alt="${image.displayName}" style="display:none;">
                        <div class="image-info">${image.sizeText}</div>
                        <div class="image-name">${image.displayName}</div>
                    `;
                    
                    // クリックイベント
                    item.addEventListener('click', () => {
                        openModal(image);
                    });
                    
                    // 順番通りにグリッドへ追加
                    galleryGrid.appendChild(item);

                    // 2. この枠に対して画像を読み込む
                    const imgElement = item.querySelector('img');
                    const placeholder = item.querySelector('.image-placeholder');
                    
                    const preloadImg = new Image();
                    preloadImg.onload = function() {
                        imgElement.src = image.path;
                        imgElement.style.display = 'block';
                        imgElement.classList.add('loaded');
                        if (placeholder) placeholder.style.display = 'none';
                        
                        // フェードイン効果
                        item.style.opacity = '1';
                    };
                    
                    preloadImg.onerror = function() {
                        if (placeholder) {
                            placeholder.innerHTML = '<i class="fas fa-exclamation-triangle"></i><p>エラー</p>';
                            placeholder.style.color = '#e74c3c';
                        }
                    };
                    
                    // 読み込み開始
                    preloadImg.src = image.path;
                    
                    // 初期状態を少し透明にしておくとフェードインが綺麗です
                    item.style.opacity = '0.3'; 
                    item.style.transition = 'opacity 0.3s ease';
                });
            }
            // 検索フィルター（検索文字列とキャラクター選択の両方に対応）

                const selectedCharacter = characterSelect.value;
                
                // まず全画像から開始
                let filtered = [...allImages];
                
                // 検索文字列でフィルター
                if (searchTerm !== '') {
                    filtered = filtered.filter(image =>
                        image.displayName.toLowerCase().includes(searchTerm)
                    );
                }
                
                // キャラクター選択でフィルター
                if (selectedCharacter !== '') {
                    filtered = filtered.filter(image => {
                        const characterName = extractCharacterName(image.displayName);
                        return characterName === selectedCharacter;
                    });
                }
                
                filteredImages = filtered;
                sortImages(); // フィルター後にソートも適用
                
                currentPage = 1;
                setupPagination();
                displayCurrentPage();
                updateImageCount();
            }

            // モーダル開く（強化版）
            function openModal(image) {
                // 現在表示中の画像リストからモーダル用配列を作成
                modalImages = [...filteredImages];
                currentModalIndex = modalImages.findIndex(img => img.path === image.path);
                currentZoom = 1;
                imagePosition = { x: 0, y: 0 };
                
                updateModalContent(image);
                
                // URLパラメータを更新（ブラウザ履歴に追加）
                const params = new URLSearchParams(window.location.search);
                params.set('', image.name);
                const newUrl = window.location.pathname + '?' + params.toString();
                history.pushState({ imageName: image.name }, '', newUrl);
                
                // アニメーション付きで表示
                modal.style.display = 'flex';
                modal.classList.remove('closing');
                document.body.style.overflow = 'hidden';
                
                // DOMの更新を待ってからアニメーションを開始
                requestAnimationFrame(() => {
                    modal.classList.add('opening');
                });
                
                // イベントリスナーを追加
                document.addEventListener('keydown', handleModalKeydown);
                
                // デバイス判定
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                const wrapper = document.getElementById('modalImageWrapper');
                
                if (isMobile) {
                    // スマホ：標準のピンチズームを使用 + ドラッグ移動機能
                    console.log('Mobile device detected: Using native pinch-zoom + custom drag');
                    
                    // タッチドラッグ機能を有効
                    wrapper.addEventListener('touchstart', startDrag, { passive: false });
                    document.addEventListener('touchmove', doDrag, { passive: false });
                    document.addEventListener('touchend', endDrag, { passive: false });
                    
                    // ダブルタップ機能も提供
                    //wrapper.addEventListener('touchend', handleDoubleTap, { passive: false });
                } else {
                    // PC：カスタムズーム機能を有効
                    document.addEventListener('wheel', handleModalWheel, { passive: false });
                    
                    // マウス用ドラッグイベント
                    wrapper.addEventListener('mousedown', startDrag);
                    document.addEventListener('mousemove', doDrag);
                    document.addEventListener('mouseup', endDrag);
                }
                fitImageToContainer();
            }

            // モーダル内容を更新
            function updateModalContent(image) {
                modalImage.src = image.path;
                modalImage.alt = image.displayName;
                modalTitle.textContent = image.displayName;
                
                // 画像読み込み完了時に自動フィット処理
                modalImage.onload = function() {
                    //fitImageToContainer();
                    updateImageDimensions(this);
                };
                
                // ファイル情報を更新
                const modalUpdated = document.getElementById('modalUpdated');
                if (modalUpdated) modalUpdated.textContent = `最終更新日: ${new Date(image.modified).toLocaleDateString()}`;
                const modalFileSize = document.getElementById('modalFileSize');
                const modalCounter = document.getElementById('modalCounter');
                

                if (modalFileSize) modalFileSize.textContent = `ファイルサイズ: ${image.sizeText}`;
                if (modalCounter) modalCounter.textContent = `${currentModalIndex + 1} / ${modalImages.length}`;
                // ナビゲーションボタンの状態更新
                updateNavigationButtons();
            }

            // 画像を容器にフィットさせる
            function fitImageToContainer() {
                const container = document.querySelector('.modal-image-container');
                const containerRect = container.getBoundingClientRect();
                const containerWidth = containerRect.width;
                const containerHeight = containerRect.height;
                
                // デバイス判定
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // 画像の自然なサイズを取得
                const naturalWidth = modalImage.naturalWidth;
                const naturalHeight = modalImage.naturalHeight;
                
                if (naturalWidth && naturalHeight) {
                    // 既存のフィットクラスを削除
                    modalImage.classList.remove('fit-width', 'fit-height');
                    
                    if (isMobile) {
                        // スマホ：標準ピンチズーム用に画像サイズを自然なサイズで設定
                        // アスペクト比を計算
                        const imageAspect = naturalWidth / naturalHeight;
                        const containerAspect = containerWidth / containerHeight;
                        
                        if (imageAspect > containerAspect) {
                            // 横長画像は幅基準でフィット
                            modalImage.style.width = '100%';
                            modalImage.style.height = 'auto';
                        } else {
                            // 縦長画像は高さ基準でフィット
                            modalImage.style.width = 'auto';
                            modalImage.style.height = '100%';
                        }
                        console.log(`Mobile fit applied: imageAspect=${imageAspect}, containerAspect=${containerAspect}`);
                    } else {
                        // PC：カスタムズーム用の従来の設定
                        const imageAspect = naturalWidth / naturalHeight;
                        const containerAspect = containerWidth / containerHeight;
                        
                        if (imageAspect > containerAspect) {
                            modalImage.classList.add('fit-width');
                        } else {
                            modalImage.classList.add('fit-height');
                        }
                    }
                }
                
                // PCのみズームとドラッグ位置をリセット
                    currentZoom = 1;
                    imagePosition = { x: 0, y: 0 };
                    applyZoom();
                console.log('Image fitted to container');
            }

            // 画像サイズ情報を更新
            function updateImageDimensions(img) {
                const modalDimensions = document.getElementById('modalDimensions');
                if (modalDimensions && img.naturalWidth && img.naturalHeight) {
                    modalDimensions.textContent = `サイズ: ${img.naturalWidth} × ${img.naturalHeight}px`;
                }
            }

            // ズームを適用
            // 640行目付近の applyZoom 関数を修正
            function applyZoom() {
                const wrapper = document.getElementById('modalImageWrapper');
                if (wrapper) {
                    // translate ではなく translate3d を使用し、Z軸に0を指定する
                    // これにより、多くのモバイルブラウザで描画品質が維持されます
                    wrapper.style.transform = `translate3d(${imagePosition.x}px, ${imagePosition.y}px, 0) scale(${currentZoom})`;
                }
                
                const zoomLevel = document.getElementById('zoomLevel');
                if (zoomLevel) {
                    zoomLevel.textContent = `${Math.round(currentZoom * 100)}%`;
                }
            }

                        // ピンチズーム用の変数
            let lastPinchDistance = 0;

            // 2点間の距離を計算する
            function getDistance(touches) {
                return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
            }



            // ナビゲーションボタンの状態を更新
            function updateNavigationButtons() {
                
                const prevBtn = document.getElementById('prevImageBtn');
                const nextBtn = document.getElementById('nextImageBtn');
                
                if (prevBtn) {
                    prevBtn.style.opacity = modalImages.length > 1 ? '1' : '0.3';
                    prevBtn.disabled = modalImages.length <= 1;
                }
                if (nextBtn) {
                    nextBtn.style.opacity = modalImages.length > 1 ? '1' : '0.3';
                    nextBtn.disabled = modalImages.length <= 1;
                }

            }

            // モーダル内で画像ナビゲーション
            function navigateModalImage(direction) {
                if (modalImages.length <= 1) return;
                
                currentModalIndex += direction;
                
                if (currentModalIndex < 0) {
                    currentModalIndex = modalImages.length - 1;
                } else if (currentModalIndex >= modalImages.length) {
                    currentModalIndex = 0;
                }
                
                const newImage = modalImages[currentModalIndex];
                updateModalContent(newImage);

                // ナビゲーション時もURLを更新（replaceStateで余分な履歴を積まない）
                const params = new URLSearchParams(window.location.search);
                params.set('', newImage.name);
                history.replaceState({ imageName: newImage.name }, '', window.location.pathname + '?' + params.toString());
            }

            // ズーム機能
            function zoomModalImage(delta) {
                currentZoom += delta;
                currentZoom = Math.max(0.25, Math.min(currentZoom, 5)); // 0.25倍から5倍まで
                applyZoom();
            }

            // ズームリセット
            function resetModalZoom() {
                fitImageToContainer(); // 自動フィットに戻す
            }

            // マウスホイールでのズーム
            function handleModalWheel(event) {
                if (modal.style.display === 'flex') {
                    event.preventDefault();
                    
                    // ホイールの方向を判定
                    const delta = event.deltaY > 0 ? -0.1 : 0.1;
                    zoomModalImage(delta);
                }
            }

// --- ドラッグ開始 (マウス/タッチ共通) ---
function startDrag(event) {
    const wrapper = document.getElementById('modalImageWrapper');
    
    if (event.touches && event.touches.length === 2) {
        // 【スマホ】ピンチ操作開始
        isDragging = false;
        lastPinchDistance = getDistance(event.touches);
        startZoom = currentZoom; 
    } else {
        // 【PC/スマホ1本指】通常のドラッグ開始
        isDragging = true;
        wrapper.classList.add('dragging');

        // タッチかマウスかで座標取得を分ける
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        
        dragStart.x = clientX - imagePosition.x;
        dragStart.y = clientY - imagePosition.y;
        console.log(`Drag started at (${clientX}, ${clientY})`);
        // PCでの画像選択（青いハイライト）などを防止
        if (!event.touches) event.preventDefault();
    }
}

// --- ドラッグ/ピンチ中 ---
function doDrag(event) {    
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  
    if (event.touches && event.touches.length === 2) {
        // 【スマホ】2本指ピンチ - 標準ピンチズームに任せる
        if (isMobile) {
            return; // 標準処理に委ねる
        }
        // PC用の古いピンチ処理（互換性のため残す）

        event.preventDefault();
        const currentDistance = getDistance(event.touches);
        
        if (lastPinchDistance > 0) {
            const ratio = currentDistance / lastPinchDistance;
            const newZoom = startZoom * ratio;
            currentZoom = Math.max(1, Math.min(newZoom, 5));
            applyZoom();
        }
    } else if (isDragging) {
        // 【PC/スマホ1本指】ドラッグ移動処理
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        
        imagePosition.x = clientX - dragStart.x;
        imagePosition.y = clientY - dragStart.y;
        
        // PCの場合のみ常にapplyZoom実行
        if (!isMobile) {
            applyZoom();
            event.preventDefault(); // ブラウザのデフォルト動作（画像ドラッグ）を阻止
        } else {
            // スマホでは軽量処理
            const wrapper = document.getElementById('modalImageWrapper');
            if (wrapper) {
                wrapper.style.transform = `translate3d(${imagePosition.x}px, ${imagePosition.y}px, 0) scale(${currentZoom})`;
            }
            // event.preventDefaultを避けて標準スクロールと共存
        }
        
        //applyZoom();
        event.preventDefault(); // ブラウザのデフォルト動作（画像ドラッグ）を阻止
    }
}

// --- ドラッグ終了 ---
function endDrag(event) {
    if (!isDragging && lastPinchDistance === 0) return;

    const wrapper = document.getElementById('modalImageWrapper');

    // 下スワイプで閉じる判定（倍率が1倍に近い時のみ）
    if (currentZoom <= 1.1 && isDragging) {
        const dragDistanceY = imagePosition.y;
        if (dragDistanceY > 150) {
            //closeModal();
            //return;
        }
        
        // 150px未満なら中央に戻す
    }

    isDragging = false;
    lastPinchDistance = 0; 
    wrapper.classList.remove('dragging');
}


            // モーダルキーボードハンドラー
            function handleModalKeydown(event) {
                switch(event.key) {
                    case 'Escape':
                        closeModal();
                        break;
                    case 'ArrowLeft':
                        event.preventDefault();
                        navigateModalImage(-1);
                        break;
                    case 'ArrowRight':
                        event.preventDefault();
                        navigateModalImage(1);
                        break;
                    case '+':
                    case '=':
                        event.preventDefault();
                        zoomModalImage(0.25);
                        break;
                    case '-':
                    case '_':
                        event.preventDefault();
                        zoomModalImage(-0.25);
                        break;
                    case '0':
                        event.preventDefault();
                        resetModalZoom();
                        break;
                }
            }

            // モーダル閉じる
            function closeModal() {
                // アニメーション付きで閉じる
                modal.classList.remove('opening');
                modal.classList.add('closing');

                // URLパラメータを削除
                const params = new URLSearchParams(window.location.search);
                params.delete('');
                const cleanUrl = params.toString()
                    ? window.location.pathname + '?' + params.toString()
                    : window.location.pathname;
                history.replaceState(null, '', cleanUrl);
                
                // アニメーション完了後にモーダルを非表示
                setTimeout(() => {
                    modal.style.display = 'none';
                    modal.classList.remove('closing');
                    document.body.style.overflow = '';
                    
                    // イベントリスナーを削除
                    document.removeEventListener('keydown', handleModalKeydown);
                    document.removeEventListener('wheel', handleModalWheel);
                    
                    // ドラッグ用イベントリスナーを削除
                    const wrapper = document.getElementById('modalImageWrapper');
                    if (wrapper) {
                        wrapper.removeEventListener('mousedown', startDrag);
                        wrapper.removeEventListener('touchstart', startDrag);
                    }
                    document.removeEventListener('mousemove', doDrag);
                    document.removeEventListener('mouseup', endDrag);
                    document.removeEventListener('touchmove', doDrag);
                    document.removeEventListener('touchend', endDrag);
                    
                    // ドラッグ状態をリセット
                    isDragging = false;
                    if (wrapper) {
                        wrapper.classList.remove('dragging');
                    }
                }, 300); // アニメーション時間と合わせる
            }

            // イベントリスナー設定
            searchInput.addEventListener('input', debounce(filterImages, 300));
            characterSelect.addEventListener('change', filterImages);
            sortSelect.addEventListener('change', sortImages);
            
            pageSizeSelect.addEventListener('change', function() {
                pageSize = parseInt(this.value);
                currentPage = 1;
                setupPagination();
                displayCurrentPage();
                updateImageCount();
            });
            
            // ページネーションボタン
            prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
            nextBtn.addEventListener('click', () => goToPage(currentPage + 1));
            firstBtn.addEventListener('click', () => goToPage(1));
            lastBtn.addEventListener('click', () => goToPage(Math.ceil(filteredImages.length / pageSize)));
            firstBtnBottom.addEventListener('click', () => goToPage(1));
            lastBtnBottom.addEventListener('click', () => goToPage(Math.ceil(filteredImages.length / pageSize)));

            prevBtnBottom.addEventListener('click', () => goToPage(currentPage - 1));
            nextBtnBottom.addEventListener('click', () => goToPage(currentPage + 1));
            
            // モーダル関連のイベントリスナー
            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('mousedown', function(e) {
                if (e.target === modal) closeModal();
            });

            // ズーム制御ボタン
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const zoomResetBtn = document.getElementById('zoomResetBtn');
            
            if (zoomInBtn) zoomInBtn.addEventListener('click', () => zoomModalImage(0.25));
            if (zoomOutBtn) zoomOutBtn.addEventListener('click', () => zoomModalImage(-0.25));
            if (zoomResetBtn) zoomResetBtn.addEventListener('click', resetModalZoom);

            // 背景色切り替えボタン
            const bgToggleBtn = document.getElementById('bgToggleBtn');
            const modalImageContainer = document.querySelector('.modal-image-container');
            let isBgWhite = false;
            if (bgToggleBtn && modalImageContainer) {
                bgToggleBtn.addEventListener('click', () => {
                    isBgWhite = !isBgWhite;
                    modalImageContainer.classList.toggle('bg-white', isBgWhite);
                    bgToggleBtn.classList.toggle('active', isBgWhite);
                    bgToggleBtn.title = isBgWhite ? '背景を黒に戻す' : '背景を白に切り替え';
                });
            }

            // ナビゲーションボタン
            const prevImageBtn = document.getElementById('prevImageBtn');
            const nextImageBtn = document.getElementById('nextImageBtn');
            
            if (prevImageBtn) prevImageBtn.addEventListener('click', () => navigateModalImage(-1));
            if (nextImageBtn) nextImageBtn.addEventListener('click', () => navigateModalImage(1));

            // ギャラリーページのキーボードショートカット（モーダルが開いていない時のみ）
            document.addEventListener('keydown', function(e) {
                if (modal.style.display !== 'flex') {
                    if (e.key === 'ArrowLeft' && !prevBtn.disabled) goToPage(currentPage - 1);
                    if (e.key === 'ArrowRight' && !nextBtn.disabled) goToPage(currentPage + 1);
                }
            });

            // デバウンス関数
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            // 初期化
            loadImages();

            // URLパラメータから画像を自動オープン
            function openImageFromUrl() {
                const params = new URLSearchParams(window.location.search);
                const imageName = params.get('');
                if (!imageName) return;

                // allImagesが読み込まれるまでリトライ
                function tryOpen() {
                    if (allImages.length === 0) {
                        setTimeout(tryOpen, 300);
                        return;
                    }
                    const target = allImages.find(img => img.name === imageName);
                    if (target) {
                        // filteredImagesにも含めてからopenModal
                        if (!filteredImages.find(img => img.name === imageName)) {
                            filteredImages = [...allImages];
                        }
                        openModal(target);
                    }
                }
                tryOpen();
            }
            openImageFromUrl();

            // ブラウザの戻るボタンでモーダルを閉じる
            window.addEventListener('popstate', function(e) {
                if (modal.style.display === 'flex') {
                    // closeModalを呼ぶが、URL操作はpopstateに任せる
                    modal.classList.remove('opening');
                    modal.classList.add('closing');
                    setTimeout(() => {
                        modal.style.display = 'none';
                        modal.classList.remove('closing');
                        document.body.style.overflow = '';
                        document.removeEventListener('keydown', handleModalKeydown);
                        document.removeEventListener('wheel', handleModalWheel);
                        const wrapper = document.getElementById('modalImageWrapper');
                        if (wrapper) {
                            wrapper.removeEventListener('mousedown', startDrag);
                            wrapper.removeEventListener('touchstart', startDrag);
                        }
                        document.removeEventListener('mousemove', doDrag);
                        document.removeEventListener('mouseup', endDrag);
                        document.removeEventListener('touchmove', doDrag);
                        document.removeEventListener('touchend', endDrag);
                        isDragging = false;
                        if (wrapper) wrapper.classList.remove('dragging');
                    }, 300);
                }
            });

            // ヘッダーにランダム画像を表示
            function showRandomHeaderImage() {
                // allImagesが読み込まれるまで待つ
                function tryShowImage() {
                    if (allImages.length === 0) {
                        setTimeout(tryShowImage, 500);
                        return;
                    }
                    const randomIndex = Math.floor(Math.random() * allImages.length);
                    const randomImage = allImages[randomIndex];
                    const headerImg = document.getElementById('headerRandomImage');
                    if (headerImg) {
                        headerImg.src = randomImage.path;
                        headerImg.alt = randomImage.displayName;
                        headerImg.onload = function() {
                            headerImg.classList.add('loaded');
                        };
                        headerImg.onerror = function() {
                            // 読み込み失敗時は別の画像を試す
                            const fallbackIndex = (randomIndex + 1) % allImages.length;
                            headerImg.src = allImages[fallbackIndex].path;
                        };
                    }
                }
                tryShowImage();
            }
            showRandomHeaderImage();
        });
    </script>
